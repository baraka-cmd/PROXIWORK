name: Temporary public profile diagnostics

on:
  push:
    branches:
      - release/proxiwork-final-delivery

jobs:
  focused-public-profile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Prepare application
        run: cp .env.example .env && php artisan key:generate
      - name: Discover Laravel packages
        run: php artisan package:discover --ansi
      - name: Run focused tests
        run: vendor/bin/phpunit --testsuite Feature --filter PublicProfessionalProfileTest
