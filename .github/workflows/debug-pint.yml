name: Temporary Pint diagnostics

on:
  push:
    branches:
      - release/proxiwork-final-delivery

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Show Pint formatting changes
        run: |
          ./vendor/bin/pint -v tests/Feature/PublicServiceSearchTest.php
          git diff -- tests/Feature/PublicServiceSearchTest.php
