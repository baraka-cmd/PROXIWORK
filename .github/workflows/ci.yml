name: CI

permissions:
  contents: write

on:
  pull_request:
    branches:
      - phase-1/foundation
      - develop
      - main
  push:
    branches:
      - phase-1/foundation
      - develop
      - main

jobs:
  test:
    name: Laravel tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Synchronize Composer lock
        if: github.event_name == 'pull_request'
        run: |
          composer update laravel/sanctum --with-dependencies --minimal-changes --no-interaction --no-progress --no-install
          if git diff --quiet -- composer.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(deps): synchronize composer lock"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare application
        run: cp .env.example .env && php artisan key:generate

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Run test suite
        run: php artisan test

      - name: Check code style
        run: ./vendor/bin/pint --test
